<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Archivos Bancarios</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./logo.png" type="image/png">
</head>
<body>

    <img class="inter-logo" src="./Logo tipo.jpg" alt="logo-interredes">
    <div class="container">
        <h1>Conversor Bancario de Liquidacion</h1>

        <form action="./upload" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="formatType">1. Selecciona el Tipo de Formato</label>
                <select name="formatType" id="formatType">
                    <option value="AUTO">Autodetectar formato automáticamente</option>
                    <option value="LIQC">Variante Avanzada (LIQC - Comercios)</option>
                    <option value="LIQD">Variante Estándar (LIQD / LDEB)</option>
                </select>
            </div>

            <div class="form-group">
                <label>2. Carga tu archivo .txt o .dat</label>
                <div class="file-drop-area" id="dropArea">
                    <div class="folder-icon"></div>
                    <div class="drop-text" id="dropText">Arrastra tu archivo aquí o haz clic para buscar</div>
                    <input type="file" name="file" class="file-input" id="fileInput" required>
                </div>
                <div id="file-name"></div>
            </div>

            <button type="submit" class="btn-submit">Procesar y Descargar Excel</button>
        </form>
    </div>
    <script src="./js/main.js"></script>
</body>
<footer class="pie-pagina">
    <div class="pie-interior">
        <div class="contenedor-logo-pie">
            <img
                class="logo-pie-pagina"
                src="interredes-logo-alt.png"
                alt="Más Interredes"
            >
        </div>
    </div>
</footer>
</html>
