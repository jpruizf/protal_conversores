<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conversor TXT a Excel</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./img/logo.png" type="image/png">
    <!-- Librería para generar archivos Excel -->
    <script src="./libs/xlsx.full.min.js"></script>

    <!-- Script principal del conversor -->
    <script type="module" src="./js/app.js" defer></script>
</head>

<body>
    <header class="encabezado-principal">
        <img
            src="./img/Logo tipo.jpg"
            alt="Logo de INTERREDES"
            class="logo-principal"
        >
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta-conversor">
            <header class="titulo-conversor">
                <h1>Conversor de Resumen de liquidación</h1>
            </header>

            <div
                id="drop-zone"
                class="zona-carga"
                role="button"
                tabindex="0"
                aria-label="Seleccionar o arrastrar un archivo TXT"
            >
                <input
                    type="file"
                    id="file-input"
                    accept=".txt,text/plain"
                    hidden
                >

                <div class="contenido-carga">
                    <span class="icono-archivo" aria-hidden="true">📄</span>

                    <p>
                        Arrastrá tu archivo TXT aquí o
                        <span class="texto-buscar">buscalo en tu equipo</span>
                    </p>
                </div>
            </div>
            <button id="convert-button"
                class="boton-convertir"
                type="button"
                disabled>
                Convertir a Excel
            </button>
            <div
                id="status-container"
                class="contenedor-estado oculto"
                aria-live="polite"
            >
                <div id="status-message" class="mensaje-estado"></div>
            </div>
        </section>
    </main>

    <footer class="pie-pagina">
        <div class="pie-contenido">
            <img
                src="./img/interredes-logo-alt.png"
                alt="Logo alternativo de INTERREDES"
                class="logo-pie"
            >
