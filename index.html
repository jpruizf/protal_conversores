<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="./css/style.css">

    <link
        rel="icon"
        href="./logo.png"
        type="image/png"
    >

    <title>Conversor PDF a Excel</title>
</head>

<body>

    <main>

        <img class="logo-tipo"
            src="./Logo tipo.jpg"
            alt="Logo INTERREDES"
        >

        <div class="container">

            <h1>Conversión de facturas de servicios</h1>

            <h4>
                PDF a Excel
            </h4>

            <div class="conversor-box">

                <form
                    id="formulario"
                    action="./convertir"
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <input
                        type="file"
                        id="archivoPDF"
                        name="archivosPDF"
                        accept=".pdf,application/pdf"
                        multiple
                        required
                    >

                    <button type="submit">
                        Convertir
                    </button>

                </form>

            </div>

            <p id="mensaje"></p>

        </div>

    </main>
</body>
<footer>

        <img
            class="interredes-logo-alt"
            src="interredes-logo-alt.png"
            alt="INTERREDES"
        >
        
        <script src="script.js"></script>
    </footer>

</html>
