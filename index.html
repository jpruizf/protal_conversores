<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Conversor Liquidación de Tarjetas
    </title>

    <link
        rel="stylesheet"
        href="./styles.css"
    >

    <link
        rel="icon"
        href="./logo.png"
        type="image/png"
    >

</head>


<body>

    <!-- LOGO PRINCIPAL -->

    <img
        class="inter-logo"
        src="./Logo tipo.jpg"
        alt="logo-interredes"
    >


    <!-- CONTENIDO PRINCIPAL -->

    <main class="contenedor">

        <section class="tarjeta">


            <!-- ENCABEZADO -->

            <header class="encabezado">

                <h1>
                    Conversor de Liquidación de Tarjetas
                </h1>

                <p>
                    Seleccione el resumen de liquidación
                    en formato PDF para convertirlo
                    automáticamente a Excel.
                </p>

            </header>


            <!-- FORMULARIO -->

            <form id="formLiquidacionTarjetas">


                <!-- ARCHIVO PDF -->

                <label
                    for="archivoPDF"
                    class="zona-archivo"
                >

                    <h2>
                        Resumen de Liquidación
                    </h2>

                    <p>
                        Seleccione un archivo PDF correspondiente
                        a tarjeta de crédito o débito.
                    </p>

                    <input
                        type="file"
                        id="archivoPDF"
                        name="archivoPDF"
                        accept=".pdf,application/pdf"
                        multiple
                        required
                    >

                    <div
                        id="nombreArchivo"
                        class="nombre-archivo"
                    >
                        Ningún archivo seleccionado
                    </div>

                </label>


                <div class="separador"></div>


                <!-- BOTÓN -->

                <div class="acciones">

                    <button
                        type="button"
                        id="btnConvertir"
                        class="boton-principal"
                    >
                        Convertir y Descargar Excel
                    </button>

                </div>

            </form>


            <!-- SPINNER -->

            <div
                id="spinner"
                class="spinner-contenedor oculto"
            >

                <div class="spinner"></div>

            </div>


            <!-- ESTADO -->

            <div
                id="estado"
                class="estado"
            ></div>


            <!-- INFORMACIÓN DEL PROCESAMIENTO -->

            <section
                id="resumen"
                class="informacion oculto"
            >

                <h3>
                    Resultado del procesamiento
                </h3>

                <p>
                    Tipo de tarjeta:
                    <strong id="tipoTarjeta">
                        -
                    </strong>
                </p>

                <p>
                    Archivo procesado:
                    <strong id="archivoProcesado">
                        -
                    </strong>
                </p>

            </section>


        </section>

    </main>


    <!-- PIE DE PÁGINA -->

    <footer>

        <img
            class="interredes-logo-alt"
            src="./interredes-logo-alt.png"
            alt="INTERREDES"
        >

    </footer>


    <!-- JAVASCRIPT -->

    <script src="./script.js"></script>

</body>

</html>
