<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Conversor Informe de Liquidación
    </title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./logo.png" type="image/png">
</head>

<body>
    <div>
        <img class="logo-tipo" src="./Logo tipo.jpg" alt="logo-interredes">
    </div>
    <main class="contenedor">

        <section class="tarjeta">

            <div class="encabezado">

                <div>
                    <h1>
                        Informe de Liquidación
                    </h1>

                    <p class="subtitulo">
                        Conversor TXT a Excel
                    </p>
                </div>
            </div>

            <div class="descripcion">
                <p>
                    Seleccione el informe de liquidación
                    en formato TXT.
                </p>

                <p>
                    El sistema consolidará automáticamente
                    la cantidad de transacciones y el importe
                    bruto de las fechas coincidentes.
                </p>
            </div>

            <form
                id="formConversor"
                class="formulario"
            >

                <div
                    id="zonaArchivo"
                    class="zona-archivo"
                >

                    <input
                        type="file"
                        id="archivoTXT"
                        accept=".txt,text/plain"
                        multiple
                    >
                    <p class="texto-seleccion">
                        Arrastre el archivo TXT aquí
                    </p>

                    <p class="texto-alternativo">
                        o
                    </p>

                    <button
                        type="button"
                        id="botonSeleccionar"
                        class="boton boton-secundario"
                    >
                        Seleccionar archivo
                    </button>

                    <p
                        id="nombreArchivo"
                        class="nombre-archivo"
                    >
                        Ningún archivo seleccionado
                    </p>

                </div>

                <button
                    type="submit"
                    id="botonConvertir"
                    class="boton boton-principal"
                    disabled
                >
                    Convertir a Excel
                </button>

            </form>

            <div
                id="estadoProceso"
                class="estado oculto"
                role="status"
                aria-live="polite"
            >
                <div
                    id="spinner"
                    class="spinner oculto"
                ></div>

                <span id="mensajeEstado"></span>
            </div>

        </section>

    </main>


</body>
