<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./logo.png" type="image/png">
    <title>Conversor TXT a Excel</title>
</head>

<body>
    <main>
        <img class="logo-principal" src="./Logo tipo.jpg" alt="logo-interredes">
        <div class="container">
            <h1>Conversor TXT a Excel</h1>
            <h4>(REPORTES PAGO FACIL)</h4>
            <div class="conversor-box">
                <form id="formulario" action="./convertir" method="POST" enctype="multipart/form-data">
                    <input type="file" id="archivoTXT" name="archivoTXT" accept=".txt" required>
                    <button type="submit">Convertir</button>
                </form>
            </div>
            <p id="mensaje"></p>
            <button id="btnDescargar" type="button" style="display: none;"> Descargar archivo convertido </button>  
        </div>    
    </main>
</body>
