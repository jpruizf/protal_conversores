<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Multibanco de Liquidaciones</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./logo.png" type="image/png">
</head>
<body>
    <img class="logo-tipo" src="./Logo tipo.jpg" alt="interredes-logo">
    <div class="container">
        
        <h2>Conversor de Liquidaciones</h2>
        
        <div class="form-group">
            <label for="bancoSelect">1. Selecciona el formato / Banco correspondiente:</label>
            <select id="bancoSelect">
                <option value="supervielle">Convertir html</option>
                <option value="banco_b">Convertir HTML</option>
                <option value="pdf">Convertir PDF</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. Carga el archivo HTML original:</label>
            <div class="box" id="dropzone" onclick="document.getElementById('fileInput').click()">
                Arrastra aquí tu archivo .html o haz clic para buscarlo.
                <input type="file" 
                    id="fileInput" 
                    accept=".pdf,application/pdf" 
                    multiple 
                    style="display:none">
                </div>
        </div>

        <div id="status"></div>
        <button id="btnConvertir">Convertir y Descargar Excel</button>
    </div>
    <!-- Vinculamos el archivo JS separado (defer asegura que cargue cuando el HTML esté listo) -->
</body>
<footer>
    <span>
        <img class="logo" src="interredes-logo-alt.png" alt="interredes-mas-cerca">
    </span>
   
    <script src="app.js" defer></script>
</footer>
</html>
