<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Resumen Comisiones Pago Fácil
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <link
        rel="icon"
        href="./logo.png"
        type="image/png"
    >
</head>

<body>

    <img
        class="inter-logo"
        src="./Logo tipo.jpg"
        alt="interredes-logo-alt"
    >

    <main class="contenedor">

        <section class="tarjeta">

            <header class="encabezado">

                <h1>
                    Resumen Comisiones Pago Fácil → Excel
                </h1>

                <p>
                    Seleccioná los reportes PDF de comisiones
                    y el archivo Excel de liquidaciones.
                </p>

            </header>


            <!-- PDF COMISIONES -->

            <label
                for="archivoPDF"
                class="zona-archivo"
                id="zonaArchivoPDF"
            >

                <h2>
                    Seleccionar reportes de comisiones
                </h2>

                <p>
                    Hacé clic aquí para elegir uno o varios archivos
                </p>

                <p>
                    Formato permitido: PDF
                </p>

                <input
                    type="file"
                    id="archivoPDF"
                    accept="application/pdf"
                    multiple
                >

            </label>


            <div
                id="pdfSeleccionados"
                class="nombre-archivo"
            >
                Ningún PDF seleccionado
            </div>


            <!-- EXCEL LIQUIDACIONES -->

            <label
                for="archivoExcel"
                class="zona-archivo"
                id="zonaArchivoExcel"
            >

                <h2>
                    Seleccionar resumen de liquidaciones
                </h2>

                <p>
                    Hacé clic aquí para elegir el archivo
                </p>

                <p>
                    Formato permitido: Excel (.xlsx)
                </p>

                <input
                    type="file"
                    id="archivoExcel"
                    accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                >

            </label>


            <div
                id="excelSeleccionado"
                class="nombre-archivo"
            >
                Ningún Excel seleccionado
            </div>


            <!-- ACCIONES -->

            <div class="acciones">

                <button
                    type="button"
                    id="btnConvertir"
                    class="boton-principal"
                >
                    Generar Excel
                </button>

            </div>


            <!-- SPINNER -->

            <div
                id="spinnerContenedor"
                class="spinner-contenedor oculto"
            >

                <div class="spinner"></div>

            </div>


            <!-- ESTADO -->

            <div
                id="estado"
                class="estado"
            ></div>

        </section>

    </main>


    <footer>

        <img
            class="interredes-logo-alt"
            src="./interredes-logo-alt.png"
            alt="interredes"
        >

        <script src="./script.js"></script>

    </footer>

</body>

</html>
